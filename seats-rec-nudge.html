                        }
                        
                        // Add tooltip to first seat (force show on initial display)
                        addTooltip(seatEl, seatType, seatElNum, true);
                        seatEl.scrollIntoView({ behavior: "smooth", block: "center" });
                        
                        // Confirm button
                        var confirmBtn = nudgeElement.querySelector(CONSTANTS.SELECTOR_CONFIRM_BTN);
                        if (confirmBtn) {
                            confirmBtn.addEventListener("click", function () {
                                recommendedSeats[currentSeatIndex].seat.click();
                                nudgeElement.style.display = "none";
                            });
                        }
                        
                        // Close button
                        var closeBtn = nudgeElement.querySelector(CONSTANTS.SELECTOR_CLOSE_BTN);
                        if (closeBtn) {
                            closeBtn.addEventListener("click", function () {
                                nudgeElement.style.display = "none";
                            });
                        }
                        
                        // Left arrow
                        var leftArrow = nudgeElement.querySelector(CONSTANTS.SELECTOR_ARROW_LEFT);
                        if (leftArrow) {
                            leftArrow.addEventListener("click", function () {
                                if (currentSeatIndex > 0) {
                                    currentSeatIndex--;
                                    updateNudgeContent();
                                }
                            });
                        }
                        
                        // Right arrow
                        var rightArrow = nudgeElement.querySelector(CONSTANTS.SELECTOR_ARROW_RIGHT);
                        if (rightArrow) {
                            rightArrow.addEventListener("click", function () {
                                if (currentSeatIndex < recommendedSeats.length - 1) {
                                    currentSeatIndex++;
                                    updateNudgeContent();
                                }
                            });
                        }
                        
                        // Add styles if not already added
                        if (!nudgeSeen) {
                            var style = docCreateElement("style");
                            style.innerHTML = nudgeStyleContent;
                            document.head.appendChild(style);
                            nudgeSeen = true;
                        }
                        
                        // Append to body
                        document.body.appendChild(nudgeElement);
                      
                        
                        // Setup hover handlers for highlighted seats
                        setupHighlightedSeatHandlers();
                        
                        // Setup hover handlers for seatmap matrix to hide/show tooltips
                        setupSeatmapMatrixHandlers();
                    }
                    
                    // Function to clear old nudges
                    function clearOldNudges() {
                        removeTooltip();
                        removeHighlightedSeatHandlers();
                        // Remove seatmap matrix handlers
                        if (seatmapMatrixHandlers.element && seatmapMatrixHandlers.mouseenter && seatmapMatrixHandlers.mouseleave) {
                            seatmapMatrixHandlers.element.removeEventListener("mouseenter", seatmapMatrixHandlers.mouseenter);
                            seatmapMatrixHandlers.element.removeEventListener("mouseleave", seatmapMatrixHandlers.mouseleave);
                            seatmapMatrixHandlers.element = null;
                            seatmapMatrixHandlers.mouseenter = null;
                            seatmapMatrixHandlers.mouseleave = null;
                        }
                        if (nudgeElement) {
                            nudgeElement.remove();
                            nudgeElement = null;
                        }
                        recommendedSeats = [];
                        currentSeatIndex = 0;
                    }
                    
                    // Function to clear old highlights
                    function clearOldHighlights() {
                        var highlightedSeats = document.querySelectorAll("." + CONSTANTS.CLASS_HIGHLIGHTED_SEAT);
                        var i;
                        var len = highlightedSeats.length;
                        for (i = 0; i < len; i++) {
                            highlightedSeats[i].classList.remove(CONSTANTS.CLASS_HIGHLIGHTED_SEAT);
                        }
                    }
    
                    // Seat highlighting function
                    function highlightSeats() {
                        if (!executedSeat) {
                            // Clear old highlights and nudges
                            clearOldHighlights();
                            clearOldNudges();
                            
                            heighLightCount = 0;
                            executedSeat = true;
                            var hasRecommendedSeats = false;
    
                    // Seat selection logic
                            var selector = null;
                    var relatedSeatTitle;
                            var discountPrices = docQuerySelectorAll(CONSTANTS.SELECTOR_DISCOUNT_PRICE);
                            var minElement = null;
                            var minPrice;
                            var container;
                            var priceText;
                            var parsedPrice;
                            var i;
                            var len;
                            var seatmapElement;
                            var frontSeats;
    
                    if (discountPrices && discountPrices.length > 0) {
                        minPrice = useMaxPrice ? CONSTANTS.MATH_NEG_INFINITY : CONSTANTS.MATH_INFINITY;
                        
                        if (discountPrices.length === 1) {
                            minElement = discountPrices[0];
                            priceText = minElement.textContent;
                            if (priceText) {
                                parsedPrice = parseFloat(priceText.trim().replace(CONSTANTS.PRICE_REGEX, ""));
                                if (!isNaN(parsedPrice)) {
                                    minPrice = parsedPrice;
                                }
                            }
                        } else {
                            len = discountPrices.length;
                            for (i = 0; i < len; i++) {
                                priceText = discountPrices[i].textContent;
                                if (priceText) {
                                    parsedPrice = parseFloat(priceText.trim().replace(CONSTANTS.PRICE_REGEX, ""));
                                    if (!isNaN(parsedPrice)) {
                                        if (useMaxPrice) {
                                            if (parsedPrice > minPrice) {
                                                minPrice = parsedPrice;
                                                minElement = discountPrices[i];
                                            }
                                        } else {
                                            if (parsedPrice < minPrice) {
                                                minPrice = parsedPrice;
                                                minElement = discountPrices[i];
                                            }
                                        }
                                    }
                                }
                            }
                        }
    
                                if (minPrice === CONSTANTS.MATH_INFINITY || minPrice === CONSTANTS.MATH_NEG_INFINITY) {
                                    console.log(CONSTANTS.MSG_NO_VALID_PRICES);
                                    minPrice = undefined;
                                } else {
                                    console.log(useMaxPrice ? CONSTANTS.MSG_HIGHEST_PRICE : CONSTANTS.MSG_LOWEST_PRICE, minPrice);
                                }
                                
                                if (minElement) {
                                    container = minElement.closest(CONSTANTS.SELECTOR_LEGEND_SECTION);
                                    if (container) {
                                        relatedSeatTitle = container.querySelector(CONSTANTS.SELECTOR_SEAT_TITLE);
                                        if (relatedSeatTitle) {
                                            relatedSeatTitle = relatedSeatTitle.textContent.trim();
                                        }
                                    }
                                    
                                    if (relatedSeatTitle === CONSTANTS.TITLE_EXIT_ROW) {
                                        selector = CONSTANTS.SELECTOR_EXIT_ROW;
                                    } else if (relatedSeatTitle === CONSTANTS.TITLE_BULKHEAD) {
                                        selector = CONSTANTS.SELECTOR_BULKHEAD;
                                    } else if (relatedSeatTitle === CONSTANTS.TITLE_FORWARD_ZONE) {
                                        selector = CONSTANTS.SELECTOR_FORWARD_ZONE;
                                    } else if (relatedSeatTitle === CONSTANTS.TITLE_MIDDLE_ZONE) {
                                        selector = CONSTANTS.SELECTOR_MIDDLE_ZONE;
                                    } else if (relatedSeatTitle === CONSTANTS.TITLE_REAR_ZONE) {
                                        selector = CONSTANTS.SELECTOR_REAR_ZONE;
                        } else {
                                        relatedSeatTitle = null;
                                    }
                                }
                            }
    
                            seatmapElement = docQuerySelector(CONSTANTS.SELECTOR_SEATMAP);
                            // Set up seatmap matrix handlers when element is found
                            if (seatmapElement) {
                                setupSeatmapMatrixHandlers();
                            }
                            frontSeats = seatmapElement ? (selector ? seatmapElement.querySelectorAll(CONSTANTS.SELECTOR_AVAILABLE + ':not(.free-seat)') : seatmapElement.querySelectorAll(CONSTANTS.SELECTOR_FRONT_SEAT + ':not(.free-seat)')) : null;
    
                            // seat highlighting logic - calculates based on availability
                            if (!(seatTDNA && seatTDNA.length > 0)) {
                                var windowSeats = [];
                                var aisleSeats = [];
                                var seatChar;
                                var seatCharLower;
                                var seatElement;
                                var totalSeats;
                                var windowPercentage;
                                var windowRatio;
                                var filteredSeats;
                                var seat;
                                
                                var collectSeats = function(seats) {
                                    var i;
                                    var len = seats.length;
                                    for (i = 0; i < len; i++) {
                                        seat = seats[i];
                                        seatElement = seat.querySelector(CONSTANTS.SELECTOR_SEAT_CHAR);
                                        if (seatElement) {
                                            seatChar = seatElement.innerHTML;
                                            if (seatChar) {
                                                seatCharLower = seatChar.trim().toLowerCase();
                                                if (seatCharLower.indexOf(CONSTANTS.STR_WINDOW) !== -1) {
                                                    windowSeats.push(seat);
                                                } else if (seatCharLower.indexOf(CONSTANTS.STR_AISLE) !== -1) {
                                                    aisleSeats.push(seat);
                                                }
                                            }
                                        }
                                    }
                                };
                                
                                if (selector && selector.length > 0 && frontSeats) {
                                    filteredSeats = [];
                                    len = frontSeats.length;
                                    for (i = 0; i < len; i++) {
                                        if (frontSeats[i].classList.contains(selector)) {
                                            filteredSeats.push(frontSeats[i]);
                                        }
                                    }
                                    collectSeats(filteredSeats);
                                } else if (frontSeats) {
                                    collectSeats(frontSeats);
                                }
                                
                                totalSeats = windowSeats.length + aisleSeats.length;
                                windowPercentage = totalSeats > 0 ? (windowSeats.length / totalSeats) * 100 : 0;
                                
                                console.log(CONSTANTS.MSG_TOTAL_SEATS + totalSeats + ", " + CONSTANTS.MSG_WINDOW + windowSeats.length + " (" + windowPercentage.toFixed(1) + "%), " + CONSTANTS.MSG_AISLE + aisleSeats.length);
                                
                                var targetWindowCount;
                                var targetAisleCount;
                                var windowSeatsLen = windowSeats.length;
                                var aisleSeatsLen = aisleSeats.length;
                                
                                if (windowSeatsLen === 0 && aisleSeatsLen > 0) {
                                    targetWindowCount = 0;
                                    targetAisleCount = aisleSeatsLen < heighLightLimit ? aisleSeatsLen : heighLightLimit;
                                    console.log(CONSTANTS.MSG_ONLY_AISLE);
                                } else if (aisleSeatsLen === 0 && windowSeatsLen > 0) {
                                    targetWindowCount = windowSeatsLen < heighLightLimit ? windowSeatsLen : heighLightLimit;
                                    targetAisleCount = 0;
                                    console.log(CONSTANTS.MSG_ONLY_WINDOW);
                                } else if (windowPercentage >= CONSTANTS.WINDOW_PERCENTAGE_THRESHOLD) {
                                    targetWindowCount = Math.ceil(heighLightLimit * CONSTANTS.WINDOW_SPLIT_RATIO);
                                    targetAisleCount = heighLightLimit - targetWindowCount;
                                    targetWindowCount = targetWindowCount < windowSeatsLen ? targetWindowCount : windowSeatsLen;
                                    targetAisleCount = targetAisleCount < aisleSeatsLen ? targetAisleCount : aisleSeatsLen;
                                } else {
                                    windowRatio = windowSeatsLen / totalSeats;
                                    targetWindowCount = Math.ceil(heighLightLimit * windowRatio * CONSTANTS.WINDOW_RATIO_MULTIPLIER);
                                    if (targetWindowCount > windowSeatsLen) targetWindowCount = windowSeatsLen;
                                    if (targetWindowCount > heighLightLimit) targetWindowCount = heighLightLimit;
                                    targetAisleCount = heighLightLimit - targetWindowCount;
                                    var aisleTarget = Math.ceil(aisleSeatsLen * CONSTANTS.AISLE_SPLIT_RATIO);
                                    if (targetAisleCount > aisleTarget) targetAisleCount = aisleTarget;
                                }
                                
                                if (windowSeatsLen > 0 && aisleSeatsLen > 0) {
                                    if (targetWindowCount > windowSeatsLen) targetWindowCount = windowSeatsLen;
                                    if (targetWindowCount > heighLightLimit) targetWindowCount = heighLightLimit;
                                    if (targetAisleCount > aisleSeatsLen) targetAisleCount = aisleSeatsLen;
                                    if (targetAisleCount > (heighLightLimit - heighLightCount)) {
                                        targetAisleCount = heighLightLimit - heighLightCount;
                                    }
                                }
                                
                                console.log(CONSTANTS.MSG_TARGET + targetWindowCount + CONSTANTS.MSG_WINDOW_SEAT + targetAisleCount + CONSTANTS.MSG_AISLE_SEAT);
                                
                                // Collect all recommended seats
                                var recommendedSeatsArray = [];
                                var windowHighlighted = 0;
                                var aisleHighlighted = 0;
                                
                                for (i = 0; i < windowSeatsLen && windowHighlighted < targetWindowCount && heighLightCount < heighLightLimit; i++) {
                                    seat = windowSeats[i];
                                    seatElement = seat.querySelector(CONSTANTS.SELECTOR_SEAT_CHAR);
                                    seatChar = seatElement ? seatElement.innerHTML.trim() : "";
                                    console.log(CONSTANTS.MSG_HIGHLIGHTING_WINDOW, seatChar, CONSTANTS.MSG_COUNT, heighLightCount);
                                    recommendedSeatsArray.push({ seat: seat, type: CONSTANTS.STR_WINDOW_SEAT });
                                    heighLightCount++;
                                    windowHighlighted++;
                                }
                                
                                for (i = 0; i < aisleSeatsLen && aisleHighlighted < targetAisleCount && heighLightCount < heighLightLimit; i++) {
                                    seat = aisleSeats[i];
                                    seatElement = seat.querySelector(CONSTANTS.SELECTOR_SEAT_CHAR);
                                    seatChar = seatElement ? seatElement.innerHTML.trim() : "";
                                    console.log(CONSTANTS.MSG_HIGHLIGHTING_AISLE, seatChar, CONSTANTS.MSG_COUNT, heighLightCount);
                                    recommendedSeatsArray.push({ seat: seat, type: CONSTANTS.STR_AISLE_SEAT });
                                    heighLightCount++;
                                    aisleHighlighted++;
                                }
                                
                                console.log(CONSTANTS.MSG_HIGHLIGHTED + windowHighlighted + " window, " + aisleHighlighted + " aisle seats");
                                
                                // Show single nudge with navigation
                                if (recommendedSeatsArray.length > 0) {
                                    hasRecommendedSeats = true;
                                    showNudgeWithNavigation(recommendedSeatsArray);
                                }
                    } else {
                                var preferredType = seatTDNA;
                                var isWindowSeat;
                                var isAisleSeat;
                                var recommendedSeatsArray = [];
                                console.log(CONSTANTS.MSG_USING_PREFERENCE, preferredType);
                                
                                if (frontSeats) {
                                    len = frontSeats.length;
                                    for (i = 0; i < len && heighLightCount < heighLightLimit; i++) {
                                        seat = frontSeats[i];
                                        if (selector && selector.length > 0 && !seat.classList.contains(selector)) {
                                            continue;
                                        }
                                        seatElement = seat.querySelector(CONSTANTS.SELECTOR_SEAT_CHAR);
                                        if (seatElement) {
                                            seatChar = seatElement.innerHTML;
                                            if (seatChar) {
                                                seatCharLower = seatChar.trim().toLowerCase();
                                                isWindowSeat = seatCharLower.indexOf(CONSTANTS.STR_WINDOW) !== -1;
                                                isAisleSeat = seatCharLower.indexOf(CONSTANTS.STR_AISLE) !== -1;
                                                
                                                if ((isWindowSeat && preferredType === CONSTANTS.STR_WINDOW_UPPER) ||
                                                    (isAisleSeat && preferredType === CONSTANTS.STR_AISLE_UPPER)) {
                                                    console.log(CONSTANTS.MSG_HIGHLIGHTING_SEAT, seatChar.trim(), CONSTANTS.MSG_PREFERRED, preferredType, CONSTANTS.MSG_COUNT, heighLightCount);
                                                    recommendedSeatsArray.push({ 
                                                        seat: seat, 
                                                        type: preferredType === CONSTANTS.STR_WINDOW_UPPER ? CONSTANTS.STR_WINDOW_SEAT : CONSTANTS.STR_AISLE_SEAT 
                                                    });
                                                    heighLightCount++;
                                                }
                                            }
                                        }
                                    }
                                }
                                
                                // Show single nudge with navigation
                                if (recommendedSeatsArray.length > 0) {
                                    hasRecommendedSeats = true;
                                    showNudgeWithNavigation(recommendedSeatsArray);
                                }
                            }
    
                            var legendDesktop = docQuerySelector(CONSTANTS.SELECTOR_LEGEND_DESKTOP);
                            if (!docQuerySelector(CONSTANTS.SELECTOR_LEGEND_LABEL) && legendDesktop && hasRecommendedSeats) {
                                var ul = docCreateElement("ul");
                                ul.classList.add(CONSTANTS.CLASS_LEGEND_SECTION, CONSTANTS.CLASS_LEGEND_SEATS);
                                var li = docCreateElement("li");
                                li.classList.add(CONSTANTS.CLASS_LEGEND_ROW, CONSTANTS.CLASS_FACILITIES_LIST, CONSTANTS.CLASS_NG_STAR_INSERTED);
                                li.innerHTML = "<div class=\"" + CONSTANTS.CLASS_LEGEND_TITLE + " " + CONSTANTS.SELECTOR_LEGEND_LABEL.substring(1) + "\"><div class=\"" + CONSTANTS.CLASS_HIGHLIGHTED_SEAT + " " + CONSTANTS.CLASS_REC_ICON + "\"></div> Recommended For You</div>";
                                ul.appendChild(li);
                                legendDesktop.appendChild(ul);
                            }
                          		     var legendMobile =document.querySelector(".seatmap-legend-mobile .legend-container .legend-mobile .mat-expansion-panel .mat-expansion-panel-content .mat-expansion-panel-body");
                            if (!docQuerySelector(CONSTANTS.SELECTOR_LEGEND_LABEL_MOBILE) && legendMobile && hasRecommendedSeats) {
                                var ul = docCreateElement("ul");
                                ul.classList.add(CONSTANTS.CLASS_LEGEND_SECTION, CONSTANTS.CLASS_LEGEND_SEATS);
                                var li = docCreateElement("li");
                                li.classList.add(CONSTANTS.CLASS_LEGEND_ROW, CONSTANTS.CLASS_FACILITIES_LIST, CONSTANTS.CLASS_NG_STAR_INSERTED);
                                li.innerHTML = "<div class=\"" + CONSTANTS.CLASS_LEGEND_TITLE + " " + CONSTANTS.SELECTOR_LEGEND_LABEL_MOBILE.substring(1) + "\"><div class=\"" + CONSTANTS.CLASS_HIGHLIGHTED_SEAT + " " + CONSTANTS.CLASS_REC_ICON + "\"></div> Recommended For You</div>";
                                ul.appendChild(li);
                                legendMobile.appendChild(ul);
                            }
                        }
                    }
                    
          /*    document.querySelector(".confirm-seat-button")?.onclick = function() {
clearOldNudges();
};*/
                    // Tab click functionality
                    var tabList = docQuerySelector(CONSTANTS.SELECTOR_TAB_LIST);
                    var tabsLength = tabList ? tabList.querySelectorAll(CONSTANTS.SELECTOR_TAB) : null;
                    var tab;
                    var tabClickHandler;
                    var len;
                    var i;
    
                    if (tabsLength) {
                        len = tabsLength.length;
                        for (i = 0; i < len; i++) {
                            tab = tabsLength[i];
                            tab._ranHighlight = false;
                            tabClickHandler = function(tabElement) {
                                return function() {
                                    if (tabElement._ranHighlight) return;
                                    tabElement._ranHighlight = true;
                                    setTimeout(function() {
                                        executedSeat = false;
                                        highlightSeats();
                                    }, CONSTANTS.TAB_CLICK_DELAY);
                                };
                            }(tab);
                            tab.addEventListener("click", tabClickHandler);
                        }
                    }
                    
                    if (!clickedFirst) {
                        if (tabsLength && tabsLength.length > 0) {
                            tabsLength[0].click();
                            clickedFirst = true;
                        } else {
                            // If no tabs, call highlightSeats directly
                            highlightSeats();
                            clickedFirst = true;
                        }
                    }

                }
            }
        );
    </script>
